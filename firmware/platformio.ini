; TinyDie Tumble firmware: STM32G041J6M6 (SO-8), bare-metal on CMSIS.  No USB stack on the MCU: the
; audit port is a USART2 single-wire link to the MCP2221A USB bridge on the base board.
[env:tumble]
platform = ststm32
board = tumble_g041j6
framework = cmsis
build_flags =
    -Isrc
    -Os -Wall -Wextra
upload_protocol = stlink
